career-profile:
  title: Développeur réseaux/Linux embarqué
  summary: |-
    Ingénieur informatique senior, j’ai plus de 20 ans d’expérience dans le développement de solutions critiques mêlant systèmes embarqués,
    sécurité réseau, performance applicative et cybersécurité.

    J’ai contribué à des projets sensibles dans les télécoms (SD-WAN), l'optimisation réseau et la sécurité IP,
    avec une forte exigence de robustesse, de documentation technique et de maîtrise du code bas niveau.

    Je suis opérationnel en développement C/C++/Python/Linux, habitué aux environnements multi-intervenants
    et orientés production continue avec une capacité à produire des livrables clairs et structurés
    (rapports, benchmarks, notes d’architecture).
